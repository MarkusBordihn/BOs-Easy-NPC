plugins {
  id 'maven-publish'
  id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

apply plugin: 'net.minecraftforge.gradle'

base {
  archivesName = "${project.mod_id}-forge-${project.minecraft_version}"
}

minecraft {
  mappings channel: 'official', version: "${project.minecraft_version}"

  reobf = false
  copyIdeResources = true

  runs {
    client {
      workingDirectory project.file('run/client')
      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'
      property 'forge.enabledGameTestNamespaces', "${project.mod_id}"

      mods {
        "${project.mod_id}" {
          source sourceSets.main
        }
      }

      // Mixin Support
      property 'mixin.env.remapRefMap', 'true'
      property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    }

    client2 {
      parent minecraft.runs.client
      workingDirectory project.file('run/client2')
      args '--username', 'guest_player'
    }

    server {
      workingDirectory project.file('run/server')
      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'
      property 'forge.enabledGameTestNamespaces', "${project.mod_id}"

      mods {
        "${project.mod_id}" {
          source sourceSets.main
        }
      }

      // Mixin Support
      property 'mixin.env.remapRefMap', 'true'
      property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    }

    gameTestServer {
      workingDirectory project.file('run/gametestserver')
      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'
      property 'forge.enabledGameTestNamespaces', "${project.mod_id}"

      mods {
        "${project.mod_id}" {
          source sourceSets.main
        }
      }

      // Mixin Support
      property 'mixin.env.remapRefMap', 'true'
      property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    }

    data {
      workingDirectory project.file('run/data')
      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'
      property 'forge.enabledGameTestNamespaces', "${project.mod_id}"

      args '--mod', "${project.mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
      mods {
        "${project.mod_id}" {
          source sourceSets.main
        }
      }
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

  // Include Common code
  compileOnly project(":Common")

  // Include Core Common code
  testCompileOnly("de.markusbordihn.easynpc:easy_npc-common-${project.minecraft_version}:${project.version}") {
    changing = true
  }
  compileOnly(fg.deobf("de.markusbordihn.easynpc:easy_npc-forge-${project.minecraft_version}:${project.version}")) {
    changing = true
  }
  runtimeOnly(fg.deobf("de.markusbordihn.easynpc:easy_npc-forge-${project.minecraft_version}:${project.version}")) {
    changing = true
  }

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency, skipped for game tests)
  if (!isGameTestRun && project.hasProperty('forge_jei_version') && project.forge_jei_version) {
    runtimeOnly fg.deobf("maven.modrinth:jei:${project.forge_jei_version}")
  }
  if (!isGameTestRun && project.hasProperty('forge_xaeros_minimap_version') && project.forge_xaeros_minimap_version) {
    runtimeOnly(fg.deobf("xaero.minimap:xaerominimap-forge-${project.minecraft_version}:${project.forge_xaeros_minimap_version}")) {
      transitive = false
    }
    runtimeOnly(fg.deobf("xaero.lib:xaerolib-forge-${project.minecraft_version}:${project.forge_xaerolib_version}")) {
      transitive = false
    }
  }

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesForgeRuntime = findLocalEasyModelEntitiesLoader('forge')
  if (easyModelEntitiesForgeRuntime != null) {
    runtimeOnly fg.deobf(easyModelEntitiesForgeRuntime)
  } else if (project.hasProperty('forge_easy_model_entities_version') && project.forge_easy_model_entities_version) {
    runtimeOnly fg.deobf("maven.modrinth:easy-model-entities:${project.forge_easy_model_entities_version}")
  }
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

// Function to calculate next major version
def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (versionParts.size() > 0) {
    def majorVersion = versionParts[0].toInteger()
    return "${majorVersion + 1}.0.0"
  }
  return "1.0.0"
}

processResources {
  from project(":Common").sourceSets.main.resources
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  inputs.property 'version', project.version

  def nextMajor = getNextMajorVersion(project.version.toString())
  inputs.property 'nextMajorVersion', nextMajor

  filesMatching(['META-INF/mods.toml']) {
    expand 'file': [
        'jarVersion'      : project.version,
        'nextMajorVersion': nextMajor
    ]
  }
}

tasks.named('jar', Jar).configure {
  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1",
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_id}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
    ])
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId project.archivesBaseName
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy tasks.named('publishToMavenLocal')
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
  def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
  it.output.resourcesDir = dir
  it.java.destinationDirectory = dir
}

// The game test world is persistent, so every run would inherit the NPCs of all previous runs.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
  doFirst {
    delete project.file('run/gametestserver/world')
  }
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Forge')
    mainFile.addRequirement('easy-npc-core')
    mainFile.addOptional('easy-model-entities')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    dependencies {
      required.project "easy-npc-core"
      optional.project "easy-model-entities"
    }
  }
}
