plugins {
  id 'maven-publish'
  id 'net.minecraftforge.gradle' version '7.0.35'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

apply plugin: 'net.minecraftforge.gradle'

base {
  archivesName = "${project.mod_id}-forge-${project.minecraft_version}"
}

minecraft {
  mappings channel: 'official', version: "${project.minecraft_version}"

  // Run configurations
  runs {

    configureEach {
      systemProperty 'forge.logging.console.level', 'debug'
      systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
    }

    client {
      workingDir = project.file('run/client')
    }

    server {
      workingDir = project.file('run/server')
    }

    gameTestServer {
      workingDir = project.file('run/gametest')
      systemProperty 'forge.enableGameTest', 'true'
      systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
      workingDir = project.file('run/data')
      args '--mod', "${project.mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
  mavenCentral()
  maven minecraft.mavenizer
  maven fg.forgeMaven
  maven fg.minecraftLibsMaven
  maven {
    name = 'Forge'
    url = 'https://maven.minecraftforge.net'
  }
  maven {
    name = 'Minecraft libraries'
    url = 'https://libraries.minecraft.net'
  }
  exclusiveContent {
    forRepository {
      maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
      }
    }
    filter {
      includeGroupAndSubgroups('org.spongepowered')
    }
  }
}

dependencies {
  implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

  annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'

  // Include Common code
  compileOnly project(":Common")

  // Include Core Common code
  testCompileOnly("de.markusbordihn.easynpc:easy_npc-common-${project.minecraft_version}:${project.version}") {
    changing = true
  }
  compileOnly("de.markusbordihn.easynpc:easy_npc-forge-${project.minecraft_version}:${project.version}") {
    changing = true
  }
  runtimeOnly("de.markusbordihn.easynpc:easy_npc-forge-${project.minecraft_version}:${project.version}") {
    changing = true
  }

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency, skipped for game tests)
  if (!isGameTestRun && project.hasProperty('forge_jei_mod') && project.forge_jei_mod) {
    runtimeOnly "curse.maven:jei-238222:${project.forge_jei_mod}"
  }
  if (!isGameTestRun && project.hasProperty('forge_xaeros_minimap_mod') && project.forge_xaeros_minimap_mod) {
    runtimeOnly "curse.maven:xaeros_minimap-263420:${project.forge_xaeros_minimap_mod}"
  }

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesForgeRuntime = findLocalEasyModelEntitiesLoader('forge')
  if (easyModelEntitiesForgeRuntime != null) {
    runtimeOnly easyModelEntitiesForgeRuntime
  } else if (project.hasProperty('forge_easy_model_entities_version')
      && project.forge_easy_model_entities_version) {
    runtimeOnly "maven.modrinth:easy-model-entities:${project.forge_easy_model_entities_version}"
  }
}

// ForgeGradle derives the "runsJson" output of its slimeLauncherMetadata tasks from their own
// "outputDirectory" output, which Gradle 9.7 refuses to evaluate before the task has run. Both
// values are set explicitly here so no output property is mapped from another one.
tasks.matching { it.name.startsWith('slimeLauncherMetadataFor') }.configureEach {
  def metadataDir = layout.buildDirectory.dir("forgegradle/${name}")
  outputDirectory.set(metadataDir)
  runsJson.set(metadataDir.map { it.dir("launcher").file("runs.json") })
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
  if (name == 'compileTestJava') {
    source(project(":Common").sourceSets.test.allSource)
  }
}

tasks.withType(Test).configureEach {
  failOnNoDiscoveredTests = false
}

// Function to calculate next major version
def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (versionParts.size() > 0) {
    def majorVersion = versionParts[0].toInteger()
    return "${majorVersion + 1}.0.0"
  }
  return "1.0.0"
}

processResources {
  from project(":Common").sourceSets.main.resources
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  inputs.property 'version', project.version

  def nextMajor = getNextMajorVersion(project.version.toString())
  inputs.property 'nextMajorVersion', nextMajor

  filesMatching(['META-INF/mods.toml']) {
    expand 'file': [
        'jarVersion'      : project.version,
        'nextMajorVersion': nextMajor
    ]
  }
}

tasks.named('processTestResources', ProcessResources).configure {
  from project(":Common").sourceSets.test.resources
}

tasks.named('compileTestJava').configure {
  dependsOn tasks.named('processTestResources')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
  dependsOn tasks.named('processTestResources')
  dependsOn tasks.named('compileTestJava')
}

tasks.named('jar', Jar).configure {
  // Ensure jar runs after test tasks since both use the same output directory
  mustRunAfter tasks.named('compileTestJava'), tasks.named('processTestResources')

  // Test instances are a data pack registry and would otherwise be loaded in every world, which
  // makes the game tests selectable through the /test command. Development runs read the source
  // set output instead of this jar and therefore keep them.
  exclude 'data/*/test_instance/**'

  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1",
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_id}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
    ])
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy tasks.named('publishToMavenLocal')
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
// Note: We merge 'test' sourceset with 'main' to avoid Java Module System conflicts where both modules
// would export the same packages. Tests are merged into the main module output directory.
def mainOutputDir = layout.buildDirectory.dir("sourcesSets/main")
sourceSets.main {
  output.resourcesDir = mainOutputDir
  java.destinationDirectory = mainOutputDir
}
sourceSets.test {
  output.resourcesDir = mainOutputDir
  java.destinationDirectory = mainOutputDir
}

// The game test world is persistent, so every run would inherit the NPCs of all previous runs.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
  doFirst {
    delete project.file('run/gametest/world')
  }
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Forge')
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRequirement('easy-npc-core')
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    dependencies {
      required.project "easy-npc-core"
      optional.project "easy-model-entities"
    }
  }
}
