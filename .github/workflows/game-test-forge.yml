name: Run game tests on Forge

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core GameTests (Forge)
        run: ./gradlew -p core Forge:runGameTestServer --no-daemon

      - name: Build Core and Publish to Maven Local
        run: ./gradlew -p core build --no-daemon

      - name: Run Config UI GameTests (Forge)
        run: ./gradlew -p config-ui Forge:runGameTestServer --no-daemon
