name: Run game tests on Forge

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Core Minecraft dependencies
        run: ./gradlew -p core :Forge:syncMavenizer --no-daemon

      - name: Run Core GameTests (Forge)
        run: ./gradlew -p core Forge:runGameTestServer --no-daemon

      - name: Build Core and Publish to Maven Local
        run: ./gradlew -p core build publishToMavenLocal --no-daemon

      - name: Prepare Config UI Minecraft dependencies
        run: ./gradlew -p config-ui :Forge:syncMavenizer --no-daemon

      - name: Run Config UI GameTests (Forge)
        run: ./gradlew -p config-ui Forge:runGameTestServer --no-daemon
