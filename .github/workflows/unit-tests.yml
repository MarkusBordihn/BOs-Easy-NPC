name: Unit Tests

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core Unit Tests
        run: ./gradlew -p core :Common:test --no-daemon

      - name: Build Core and Publish to Maven Local
        run: ./gradlew -p core :Common:build publishToMavenLocal --no-daemon

      - name: Run Config UI Unit Tests
        run: ./gradlew -p config-ui :Common:test --no-daemon
