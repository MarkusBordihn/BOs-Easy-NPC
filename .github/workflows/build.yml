name: Build

on: workflow_call

jobs:
  build:
    name: Core, Config UI and Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x gradlew

      - name: Build Core
        run: ./gradlew -p core --console=plain assemble publishToMavenLocal

      - name: Build Config UI
        run: ./gradlew -p config-ui --console=plain assemble publishToMavenLocal

      - name: Build Bundle
        run: ./gradlew -p bundle --console=plain assemble
