name: Run game tests on Fabric

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core GameTests (Fabric)
        run: ./gradlew -p core Fabric:runGameTest

      - name: Build Core and Publish to Maven Local
        run: ./gradlew -p core build publishToMavenLocal

      - name: Run Config UI GameTests (Fabric)
        run: ./gradlew -p config-ui Fabric:runGameTest

      - name: Build Config UI and Publish to Maven Local
        run: ./gradlew -p config-ui build publishToMavenLocal

      - name: Run Bundle GameTests (Fabric)
        run: ./gradlew -p bundle Fabric:runGameTest
