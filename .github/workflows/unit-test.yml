name: Unit tests

on: workflow_call

jobs:
  unit-test:
    name: Core and Config UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x gradlew

      - name: Run Core unit tests
        run: ./gradlew -p core --console=plain check publishToMavenLocal

      - name: Run Config UI unit tests
        run: ./gradlew -p config-ui --console=plain check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: |
            core/*/build/reports/tests/
            config-ui/*/build/reports/tests/
          if-no-files-found: ignore
