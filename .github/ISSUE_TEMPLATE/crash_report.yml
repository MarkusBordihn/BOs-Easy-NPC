name: "💥 Crash report"
description: "Game crashed? Tell us what happened - we’ll help you get back in!"
labels: [ crash ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a crash! 💥
        No worries - share a few details and a log link, and we’ll try to sort it out fast.
        Please reproduce crashes with an official Minecraft installation, CurseForge App, Modrinth App, or a clean manual install using official or authorized game files.
  - type: input
    id: mc_version
    attributes:
      label: "Minecraft version"
      placeholder: "e.g. 1.20.1"
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: "Easy NPC mod version"
      placeholder: "e.g. 6.0.13"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: "Loader"
      options:
        - Fabric
        - Forge
        - NeoForge (1.21.x+)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "What happened? 📝"
      placeholder: "When does it crash? Startup, world load, when clicking something, etc."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce (if known) ▶️"
      placeholder: |
        1. Open world ...
        2. Do ...
        3. Crash happens ...
    validations:
      required: false
  - type: input
    id: logs
    attributes:
      label: "Log or crash-report link (required) 🔗"
      description: "Upload latest.log and the crash report to https://mclo.gs/ or https://gist.github.com/ and paste the link here."
      placeholder: "https://mclo.gs/xxxx or https://gist.github.com/xxxx"
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: "Additional info (optional) 📎"
      description: "How often it happens, any workarounds tried, hardware specifics, etc."
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Before submitting"
      options:
        - label: "I can reproduce this crash with a legitimate Minecraft installation using official or authorized game files, a supported launcher/setup, and a clean mod setup."
          required: true
