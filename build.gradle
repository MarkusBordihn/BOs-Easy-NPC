apply plugin: 'java'
import org.gradle.tooling.GradleConnector

subprojects {

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '8.14.3'
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

}

// Override default build task to build all modules
tasks.named('build') {
  description = 'Builds all modules (core, config-ui, bundle)'

  doLast {
    // Define module directories
    def modules = ['core', 'config-ui', 'bundle']

    // Build each module
    modules.each { moduleName ->
      def moduleDir = file("${rootDir}/${moduleName}")

      println "Building module: ${moduleName}"
      def connection = GradleConnector.newConnector()
          .forProjectDirectory(moduleDir)
          .connect()

      try {
        def buildLauncher = connection.newBuild()
        buildLauncher.forTasks('build')
        buildLauncher.setStandardOutput(System.out)
        buildLauncher.setStandardError(System.err)
        buildLauncher.run()
        println "Successfully built module: ${moduleName}"
      } finally {
        connection.close()
      }
    }

    println "All modules successfully built."
  }
}

// Override clean build task to build all modules
tasks.named('clean') {
  description = 'Cleans all modules (core, config-ui, bundle)'

  dependsOn 'cleanGradleDirs'

  doLast {
    // Define module directories
    def modules = ['core', 'config-ui', 'bundle']

    // Build each module
    modules.each { moduleName ->
      def moduleDir = file("${rootDir}/${moduleName}")

      println "Building module: ${moduleName}"
      def connection = GradleConnector.newConnector()
          .forProjectDirectory(moduleDir)
          .connect()

      try {
        def buildLauncher = connection.newBuild()
        buildLauncher.forTasks('clean')
        buildLauncher.setStandardOutput(System.out)
        buildLauncher.setStandardError(System.err)
        buildLauncher.run()
        println "Successfully clean module: ${moduleName}"
      } finally {
        connection.close()
      }
    }

    println "All modules successfully clean."
  }
}

// Clean and build all modules
tasks.named('cleanBuild') {
  description = 'Cleans and builds all modules (core, config-ui, bundle)'
  group = "build"

  // Make sure clean runs first
  dependsOn 'clean'

  // Then build all modules
  dependsOn 'build'

  tasks.build.mustRunAfter tasks.clean

  doLast {
    println "All modules successfully cleaned and built."
  }
}

// Remove all .gradle directories in project and subproject folders
tasks.register('cleanGradleDirs') {
  description = 'Deletes all .gradle directories in project and subproject folders'
  group = "build"

  doLast {
    def dirsToClean = []
    rootDir.eachFileRecurse { file ->
      if (file.isDirectory() && file.name == '.gradle') {
        dirsToClean << file
      }
    }
    dirsToClean.each { dir ->
      println "Deleting: ${dir}"
      dir.deleteDir()
    }
    println ".gradle directories deleted: ${dirsToClean.size()}"
  }
}

// Clean cache and build all modules with refreshed dependencies
tasks.register('cleanCache') {
  description = 'Cleans cache and builds all modules with refreshed dependencies (core, config-ui, bundle)'
  group = "build"

  doLast {
    // Define module directories
    def modules = ['core', 'config-ui', 'bundle']

    // Process each module
    modules.each { moduleName ->
      def moduleDir = file("${rootDir}/${moduleName}")

      println "Cleaning cache and building module: ${moduleName}"
      def connection = GradleConnector.newConnector()
          .forProjectDirectory(moduleDir)
          .connect()

      try {
        def buildLauncher = connection.newBuild()
        buildLauncher.forTasks('clean', 'build')
        buildLauncher.withArguments('--refresh-dependencies')
        buildLauncher.setStandardOutput(System.out)
        buildLauncher.setStandardError(System.err)
        buildLauncher.run()
        println "Successfully cleaned cache and built module: ${moduleName}"
      } finally {
        connection.close()
      }
    }

    println "All modules successfully cleaned cache and built with refreshed dependencies."
  }
}

// Create a publish task to build and publish all modules sequentially
tasks.register('publish') {
  description = 'Builds and publishes all modules sequentially (core, config-ui, bundle)'
  group = "publishing"

  // Make sure build runs first
  dependsOn 'cleanBuild'

  doLast {
    // Define module directories in the order they should be published
    def modules = ['core', 'config-ui', 'bundle']

    // Publishing tasks to run for each module
    def publishingTasks = ['modrinth', 'curseforge']

    // Process each module sequentially
    modules.each { moduleName ->
      def moduleDir = file("${rootDir}/${moduleName}")

      // Run each publishing task sequentially for the current module
      publishingTasks.each { publishTask ->
        println "Publishing module: ${moduleName} with task: ${publishTask}"
        def connection = GradleConnector.newConnector()
            .forProjectDirectory(moduleDir)
            .connect()

        try {
          def publishLauncher = connection.newBuild()
          publishLauncher.forTasks(publishTask)
          publishLauncher.setStandardOutput(System.out)
          publishLauncher.setStandardError(System.err)
          publishLauncher.run()
          println "Successfully published module: ${moduleName} with task: ${publishTask}"

          // Add delay of 5 seconds after each publishing task
          println "Waiting 5 seconds before proceeding to the next task..."
          sleep(5000)
        } catch (Exception e) {
          println "Warning: Failed to execute ${publishTask} for module: ${moduleName}"
          println "Error message: ${e.message}"
        } finally {
          connection.close()
        }
      }
    }

    println "All modules successfully published."
  }
}
