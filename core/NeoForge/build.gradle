plugins {
  id 'maven-publish'
  id 'net.neoforged.gradle.userdev' version '7.0.190'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
  configureEach {
    systemProperty 'forge.logging.markers', 'REGISTRIES'
    systemProperty 'forge.logging.console.level', 'debug'
    modSource project.sourceSets.main
  }

  client {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
  }

  client2 {
    runType('client')
    workingDirectory project.file('runs/client2')
    arguments.addAll '--username', 'guest_player'
  }

  server {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    arguments.add '--nogui'
  }

  gameTestServer {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
  }

  data {
    arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  implementation "net.neoforged:neoforge:${project.neoforge_version}"

  // Include Common code
  implementation project(":Common")

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency, skipped for game tests)
  if (!isGameTestRun && project.hasProperty('neoforge_jei_version') && project.neoforge_jei_version) {
    runtimeOnly "maven.modrinth:jei:${project.neoforge_jei_version}"
  }
  if (!isGameTestRun && project.hasProperty('neoforge_xaeros_minimap_version') && project.neoforge_xaeros_minimap_version) {
    runtimeOnly("xaero.minimap:xaerominimap-neoforge-${project.minecraft_version}:${project.neoforge_xaeros_minimap_version}") {
      transitive = false
    }
    runtimeOnly("xaero.lib:xaerolib-neoforge-${project.minecraft_version}:${project.neoforge_xaerolib_version}") {
      transitive = false
    }
  }

  // Cobblemon (compileOnly for Cobblemon NPC support, requires Kotlin for Forge + Architectury at runtime)
  compileOnly "maven.modrinth:cobblemon:${project.neoforge_cobblemon_version}"
  //runtimeOnly "maven.modrinth:cobblemon:${project.neoforge_cobblemon_version}"
  //runtimeOnly "maven.modrinth:kotlin-for-forge:${project.neoforge_kotlin_for_forge_version}"
  //runtimeOnly "maven.modrinth:architectury-api:${project.neoforge_architectury_version}"

  // Epic Fight integration
  compileOnly "maven.modrinth:epic-fight:${project.neoforge_epic_fight_version}"

  // Easy Model Entities (API support)
  def easyModelEntitiesLocal = findLocalEasyModelEntities()
  if (easyModelEntitiesLocal != null) {
    compileOnly files(easyModelEntitiesLocal)
    testCompileOnly files(easyModelEntitiesLocal)
  } else if (project.hasProperty('neoforge_easy_model_entities_version') && project.neoforge_easy_model_entities_version) {
    compileOnly "maven.modrinth:easy-model-entities:${project.neoforge_easy_model_entities_version}"
    testCompileOnly "maven.modrinth:easy-model-entities:${project.neoforge_easy_model_entities_version}"
  }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesNeoForgeRuntime = findLocalEasyModelEntitiesLoader('neoforge')
  if (easyModelEntitiesNeoForgeRuntime != null) {
    runtimeOnly easyModelEntitiesNeoForgeRuntime
  } else if (project.hasProperty('neoforge_easy_model_entities_version') && project.neoforge_easy_model_entities_version) {
    runtimeOnly "maven.modrinth:easy-model-entities:${project.neoforge_easy_model_entities_version}"
  }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allSource)
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allJava)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from project(":Common").sourceSets.main.resources
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId project.archivesBaseName
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy 'publishToMavenLocal'
}

test {
  exclude '**/mixin/**'
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('NeoForge')
    mainFile.addOptional('armourers-workshop')
    mainFile.addOptional('easy-model-entities')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
      optional.project "armourers-workshop"
      optional.project "easy-model-entities"
    }
  }
}
