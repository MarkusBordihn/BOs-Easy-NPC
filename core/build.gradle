buildscript {
  // The toolkit is only published to Maven Local, so its client test plugin stays optional and a
  // machine without it still builds and runs the game tests.
  String toolkitPluginModule = "client_runtime_interface_toolkit-gradle-plugin-${minecraft_version}"
  String toolkitPluginVersion = '2.0.0'
  File toolkitPluginDirectory = new File(
      System.getProperty('maven.repo.local', "${System.getProperty('user.home')}/.m2/repository"),
      "de/markusbordihn/clientruntimeinterfacetoolkit/${toolkitPluginModule}/${toolkitPluginVersion}")
  ext.clientRuntimeTestPluginAvailable = toolkitPluginDirectory.isDirectory()
  repositories {
    mavenLocal {
      content {
        includeGroup 'de.markusbordihn.clientruntimeinterfacetoolkit'
      }
    }
  }
  dependencies {
    if (clientRuntimeTestPluginAvailable) {
      classpath "de.markusbordihn.clientruntimeinterfacetoolkit:${toolkitPluginModule}:${toolkitPluginVersion}"
    }
  }
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(17)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    mavenLocal()
    maven {
      name = "Modrinth"
      url = "https://api.modrinth.com/maven"
      content {
        includeGroup "maven.modrinth"
      }
    }
    maven {
      name = "Xaero"
      url = "https://chocolateminecraft.com/maven"
      content {
        includeGroup "xaero.minimap"
        includeGroup "xaero.lib"
      }
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.fork = true
    options.forkOptions.memoryMaximumSize = '2g'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}

  // Development helper mods like JEI or Xaero's Minimap are left out of game and client test runs,
  // because they are not needed there and can crash the game test server.
  ext.isTestRun = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase()
    return ['gametest', 'clienttest', 'fullcheck'].any { testTask -> taskName.contains(testTask) }
  }

  // Local Easy Model Entities common artifact (compile); null falls back to Modrinth.
  ext.findLocalEasyModelEntities = { ->
    def version = project.findProperty('easy_model_entities_version')
    if (version == null) {
      return null
    }
    def mcVersion = project.minecraft_version
    if (project.hasProperty('easy_model_entities_local_jar')) {
      def localJar = file(project.easy_model_entities_local_jar)
      if (localJar.exists()) {
        return localJar
      }
    }
    def mavenLocalJar =
        file("${System.getProperty('user.home')}/.m2/repository/de/markusbordihn/easymodelentities/"
            + "easy_model_entities-common-${mcVersion}/${version}/"
            + "easy_model_entities-common-${mcVersion}-${version}.jar")
    return mavenLocalJar.exists() ? mavenLocalJar : null
  }

  // Local Easy Model Entities loader artifact (runtime); null falls back to Modrinth.
  ext.findLocalEasyModelEntitiesLoader = { String loader ->
    def version = project.findProperty('easy_model_entities_version')
    if (version == null) {
      return null
    }
    def mcVersion = project.minecraft_version
    def jar =
        file("${System.getProperty('user.home')}/.m2/repository/de/markusbordihn/easymodelentities/"
            + "easy_model_entities-${loader}-${mcVersion}/${version}/"
            + "easy_model_entities-${loader}-${mcVersion}-${version}.jar")
    if (!jar.exists()) {
      return null
    }

    // Fabric Loom keys its remap cache by coordinate and version only, so a jar republished to
    // mavenLocal under the same version would keep resolving to the previous remap.
    rootProject.file(".gradle/loom-cache/remapped_mods")
        .listFiles()
        ?.collectMany { mappingsDirectory ->
          new File(mappingsDirectory, "de/markusbordihn/easymodelentities")
              .listFiles()?.toList() ?: []
        }
        ?.findAll { artifactDirectory ->
          artifactDirectory.name == "easy_model_entities-${loader}-${mcVersion}"
              || artifactDirectory.name.startsWith("easy_model_entities-${loader}-${mcVersion}-")
        }
        ?.collect { artifactDirectory -> new File(artifactDirectory, version) }
        ?.findAll { remappedVersion ->
          remappedVersion.isDirectory() && remappedVersion.lastModified() < jar.lastModified()
        }
        ?.each { staleRemap ->
          logger.lifecycle("Discarding stale Loom remap ${staleRemap}")
          project.delete(staleRemap)
        }
    return "de.markusbordihn.easymodelentities:easy_model_entities-${loader}-${mcVersion}:${version}"
  }

  configurations.configureEach {
    resolutionStrategy {
      cacheChangingModulesFor 5, 'minutes'
      cacheDynamicVersionsFor 60, 'minutes'
    }
  }
}

apply from: "$rootDir/../gradle/tasks/updateModVersions.gradle"

configure(subprojects.findAll { subproject -> subproject.name in ['Forge', 'Fabric'] }) {
  apply from: "$rootDir/../gradle/releaseSmokeTestConfig.gradle"
}

tasks.register('allGameTests') {
  group = 'verification'
  description = 'Runs both Fabric and Forge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer'
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs check and game tests for all platforms (Common, Fabric, Forge).'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', 'allGameTests'
}

if (clientRuntimeTestPluginAvailable) {
  apply plugin: 'de.markusbordihn.clientruntimeinterfacetoolkit.client-test'
  clientRuntimeTest {
    loaders = ['Fabric', 'Forge']
  }
}
