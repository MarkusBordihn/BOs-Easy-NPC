apply from: file('../build.gradle')

tasks.register('runAllGameTests') {
  group = 'verification'
  description = 'Runs both Fabric and Forge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer'
}

tasks.register('buildCore') {
  group = 'build'
  description = 'Builds the core mod.'
  dependsOn ':Fabric:build', ':Forge:build'
}
