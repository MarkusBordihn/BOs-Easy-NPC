plugins {
  id 'maven-publish'
  id 'net.minecraftforge.accesstransformers' version '5.0.1'
  id 'net.minecraftforge.gradle' version '[7.0.17,8)'
  id 'net.darkhax.curseforgegradle' version '1.2.30'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

apply plugin: 'net.minecraftforge.gradle'

base {
  archivesName = "${project.mod_id}-forge-${project.minecraft_version}"
}

minecraft {
  mappings channel: 'official', version: "${project.minecraft_version}"

  // Run configurations
  runs {

    configureEach {
      systemProperty 'forge.logging.console.level', 'debug'
      systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
      args "-mixin.config=${mod_id}.forge.mixins.json"
    }

    client {
      workingDir = project.file('run/client')
    }

    server {
      workingDir = project.file('run/server')
    }

    gameTestServer {
      workingDir = project.file('run/gametest')
      systemProperty 'forge.enableGameTest', 'true'
      systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
      workingDir = project.file('run/data')
      args '--mod', "${project.mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
  mavenCentral()
  maven minecraft.mavenizer
  maven fg.forgeMaven
  maven fg.minecraftLibsMaven
  maven {
    name = 'Forge'
    url = 'https://maven.minecraftforge.net'
  }
  maven {
    name = 'Minecraft libraries'
    url = 'https://libraries.minecraft.net'
  }
  exclusiveContent {
    forRepository {
      maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
      }
    }
    filter {
      includeGroupAndSubgroups('org.spongepowered')
    }
  }
}

dependencies {
  implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

  annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

  // Include Common code
  compileOnly project(":Common")

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency, skipped for game tests)
  if (!isGameTestRun && project.hasProperty('forge_jei_mod') && project.forge_jei_mod) {
    runtimeOnly "curse.maven:jei-238222:${project.forge_jei_mod}"
  }
  if (!isGameTestRun && project.hasProperty('forge_xaeros_minimap_mod') && project.forge_xaeros_minimap_mod) {
    runtimeOnly "curse.maven:xaeros_minimap-263420:${project.forge_xaeros_minimap_mod}"
  }

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

  // Easy Model Entities (API support)
  def easyModelEntitiesLocal = findLocalEasyModelEntities()
  if (easyModelEntitiesLocal != null) {
    compileOnly files(easyModelEntitiesLocal)
    testCompileOnly files(easyModelEntitiesLocal)
  } else if (project.hasProperty('forge_easy_model_entities_version')
      && project.forge_easy_model_entities_version) {
    compileOnly "maven.modrinth:easy-model-entities:${project.forge_easy_model_entities_version}"
    testCompileOnly "maven.modrinth:easy-model-entities:${project.forge_easy_model_entities_version}"
  }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesForgeRuntime = findLocalEasyModelEntitiesLoader('forge')
  if (easyModelEntitiesForgeRuntime != null) {
    runtimeOnly easyModelEntitiesForgeRuntime
  } else if (project.hasProperty('forge_easy_model_entities_version')
      && project.forge_easy_model_entities_version) {
    runtimeOnly "maven.modrinth:easy-model-entities:${project.forge_easy_model_entities_version}"
  }
}

// ForgeGradle derives the "runsJson" output of its slimeLauncherMetadata tasks from their own
// "outputDirectory" output, which Gradle 9.7 refuses to evaluate before the task has run. Both
// values are set explicitly here so no output property is mapped from another one.
tasks.matching { it.name.startsWith('slimeLauncherMetadataFor') }.configureEach {
  def metadataDir = layout.buildDirectory.dir("forgegradle/${name}")
  outputDirectory.set(metadataDir)
  runsJson.set(metadataDir.map { it.dir("launcher").file("runs.json") })
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
  if (name == 'compileTestJava') {
    source(project(":Common").sourceSets.test.allSource)
  }
}

tasks.withType(Test).configureEach {
  failOnNoDiscoveredTests = false
}

processResources {
  from project(":Common").sourceSets.main.resources
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
}

tasks.named('processTestResources', ProcessResources).configure {
  from project(":Common").sourceSets.test.resources
}

tasks.named('compileTestJava').configure {
  dependsOn tasks.named('processTestResources')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
  dependsOn tasks.named('processTestResources')
  dependsOn tasks.named('compileTestJava')
}

tasks.named('jar', Jar).configure {
  from(project(":Common").sourceSets.main.output)

  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  // Test instances are a data pack registry and would otherwise be loaded in every world, which
  // makes the game tests selectable through the /test command. Development runs read the source
  // set output instead of this jar and therefore keep them.
  exclude 'data/*/test_instance/**'

  mustRunAfter tasks.named('compileTestJava'), tasks.named('processTestResources')

  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1",
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_id}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        "MixinConfigs"            : "easy_npc.forge.mixins.json",
    ])
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy tasks.named('publishToMavenLocal')
}

test {
  useJUnitPlatform()
  exclude '**/*'
}

// Merge the resources and classes into the same directory.
def mainOutputDir = layout.buildDirectory.dir("sourcesSets/main")
sourceSets.main {
  output.resourcesDir = mainOutputDir
  java.destinationDirectory = mainOutputDir
}

// Development runs load this directory instead of the jar, and Mixin only picks up the mixin
// config from a manifest. Without it every development run, including the game test server, starts
// with no mixins applied.
tasks.register('devManifest') {
  def manifestFile = mainOutputDir.map { it.file("META-INF/MANIFEST.MF") }
  doLast {
    def target = manifestFile.get().asFile
    target.parentFile.mkdirs()
    target.text = "Manifest-Version: 1.0\nMixinConfigs: ${mod_id}.forge.mixins.json\n"
  }
}
tasks.named('devManifest').configure {
  mustRunAfter tasks.named('classes'), tasks.named('compileTestJava'),
      tasks.named('processTestResources')
}
tasks.matching { it.name.startsWith('run') }.configureEach {
  dependsOn tasks.named('devManifest')
}
sourceSets.test {
  output.resourcesDir = mainOutputDir
  java.destinationDirectory = mainOutputDir
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Forge')
    mainFile.addOptional('easy-model-entities')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    dependencies {
      optional.project "easy-model-entities"
    }
  }
}
