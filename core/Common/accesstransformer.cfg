# Access Transformer config for Common, mirrored by the access widener and transformers of the
# loaders. It lives outside of the resources, because the loaders copy the Common resources into
# their own jar, where a second META-INF/accesstransformer.cfg would collide.
public net.minecraft.client.renderer.rendertype.RenderType create(Ljava/lang/String;Lnet/minecraft/client/renderer/rendertype/RenderSetup;)Lnet/minecraft/client/renderer/rendertype/RenderType;
