plugins {
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.126'
}

base {
  archivesName = "${project.mod_id}-common-${project.minecraft_version}"
}

neoForge {
  neoFormVersion = neo_form_version

  accessTransformers {
    from 'accesstransformer.cfg'
  }

  // Add Minecraft classes to test configuration
  addModdingDependenciesTo(sourceSets.test)
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  def easyModelEntitiesLocal = findLocalEasyModelEntities()
  if (easyModelEntitiesLocal != null) {
    compileOnly files(easyModelEntitiesLocal)
    testCompileOnly files(easyModelEntitiesLocal)
  } else {
    def easyModelEntitiesFallback = ['forge', 'fabric', 'neoforge']
        .collect { loader -> project.findProperty("${loader}_easy_model_entities_version") }
        .find { version -> version }
    if (!easyModelEntitiesFallback) {
      throw new GradleException(
          "Easy Model Entities is needed to compile, but neither a local jar was found nor is a " +
              "<loader>_easy_model_entities_version property set in gradle.properties.")
    }
    compileOnly "maven.modrinth:easy-model-entities:${easyModelEntitiesFallback}"
    testCompileOnly "maven.modrinth:easy-model-entities:${easyModelEntitiesFallback}"
  }

  // JUnit 5 for unit testing
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

test {
  useJUnitPlatform()
  testLogging {
    events "passed", "skipped", "failed"
  }
}

apply from: "$projectDir/../gradle/tasks/generateRawNPCs.gradle"
apply from: "$projectDir/../gradle/tasks/generateDefaultPresetIndex.gradle"

tasks.named('compileJava') {
  dependsOn tasks.named('generateRawNPCs')
  // generateRawNPCs writes generated sources in-place into src/main/java, which the Gradle
  // build cache cannot track reliably (a cached run can omit RawNPCType.class). Skip caching
  // this task so compilation always reflects the freshly generated sources.
  outputs.cacheIf { false }
}

processResources {
  dependsOn tasks.named('generateDefaultPresetIndex')
}

tasks.named('sourcesJar') {
  dependsOn tasks.named('generateDefaultPresetIndex')
  dependsOn tasks.named('generateRawNPCs')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy tasks.named('publishToMavenLocal')
}

tasks.register("prepareWorkspace") {
  group = "ide"
  description = "Runs post-sync tasks for IDE integration"
}
