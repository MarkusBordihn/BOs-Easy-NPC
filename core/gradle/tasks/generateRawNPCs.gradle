  inputs.file(templateFile)
  inputs.file(buildFile)
  inputs.files(fileTree(rawNPCFolder) {
    include '*.imports'
    include '*.methods'
    include '**/*.imports'
    include '**/*.methods'
  }).optional(true)
  outputs.files(npcClasses.collect { npcClass ->
    def targetFolder = npcClass.subfolder ? new File(rawNPCFolder, npcClass.subfolder) : rawNPCFolder
    file("${targetFolder}/${npcClass.className}.java")
  })

  def loadMethods = { String className, String subfolder ->
    if (subfolder) {
      def subfolderFile = new File(new File(rawNPCFolder, subfolder), "${className}.methods")
      if (subfolderFile.exists()) {
        return subfolderFile.text
      }
    }
    def mainFile = new File(rawNPCFolder, "${className}.methods")
    return mainFile.exists() ? mainFile.text : ""
  }

  def loadImports = { String className, String subfolder ->
    if (subfolder) {
      def subfolderFile = new File(new File(rawNPCFolder, subfolder), "${className}.imports")
      if (subfolderFile.exists()) {
        return subfolderFile.text
      }
    }
    def mainFile = new File(rawNPCFolder, "${className}.imports")
    return mainFile.exists() ? mainFile.text : ""
  }

  def toUpperSnakeCase = { String input ->
    return input.replaceAll(/([a-z])([A-Z])/, '$1_$2').toUpperCase(Locale.ROOT)
  }

  def toEnumName = { String id ->
    return id.replace("_raw", "").toUpperCase(Locale.ROOT)
  }

  doLast {
    def outputDir = rawNPCFolder
    def rawNPCTypeFile = file("$projectDir/../Common/src/main/java/de/markusbordihn/easynpc/data/npc/RawNPCType.java")

    // Update RawNPCType enum
    if (rawNPCTypeFile.exists()) {
      println "🔄 Updating RawNPCType enum values..."
      def enumContent = rawNPCTypeFile.text
      def startMarker = "// ===== AUTO_GENERATED_START: Do not edit between these markers ====="
      def endMarker = "// ===== AUTO_GENERATED_END ====="

      def startIndex = enumContent.indexOf(startMarker)
      def endIndex = enumContent.indexOf(endMarker)

      if (startIndex != -1 && endIndex != -1) {
        def beforeMarker = enumContent.substring(0, startIndex + startMarker.length())
        def afterMarker = enumContent.substring(endIndex)

        def enumValues = npcClasses.collect { npcClass ->
          "  ${toEnumName(npcClass.id)}"
        }.join(",\n")

        def newContent = beforeMarker + "\n" + enumValues + ";\n  " + afterMarker
        rawNPCTypeFile.write(newContent)
        println "✅ Updated RawNPCType with ${npcClasses.size()} enum values"
      } else {
        println "⚠️  Could not find AUTO_GENERATED markers in RawNPCType.java"
      }
    } else {
      println "⚠️  RawNPCType.java not found at ${rawNPCTypeFile}"
    }

    println "✨ Processing ${npcClasses.size()} NPC classes from ${templateFile} to ${outputDir} ..."
    npcClasses.each { npcClass ->
      def targetFolder = npcClass.subfolder ? new File(outputDir, npcClass.subfolder) : outputDir
      targetFolder.mkdirs() // Ensure subfolder exists

      def outputFile = new File(targetFolder, npcClass.className + ".java")
      def packagePath = npcClass.subfolder ? "de.markusbordihn.easynpc.api.npc.raw.${npcClass.subfolder}" : "de.markusbordihn.easynpc.api.npc.raw"

      def content = templateFile.text
          .replace("package de.markusbordihn.easynpc.api.npc.raw;", "package ${packagePath};")
          .replace("import net.minecraft.world.entity.monster.Zombie;", "import " + npcClass.class + ";")
          .replace("import de.markusbordihn.easynpc.data.skin.variant.ZombieSkinVariant;", "import de.markusbordihn.easynpc.data.skin.variant." + npcClass.variant.replaceAll(/\.[^.]+$/, "") + ";")
          .replace("RawNPCType.ZOMBIE", "RawNPCType." + toEnumName(npcClass.id))
          .replace("npc_raw_template", npcClass.id)
          .replace("NPCRawTemplate", npcClass.className)
          .replaceAll("\\bZombie\\b", npcClass.baseClass)
          .replace("SkinModel.ZOMBIE", "SkinModel." + (npcClass.skinModel ?: toUpperSnakeCase(npcClass.baseClass)))
          .replace("ModelType.ZOMBIE", "ModelType." + (npcClass.modelType ?: toUpperSnakeCase(npcClass.baseClass)))
          .replace("ZombieSkinVariant.ZOMBIE", npcClass.variant)
          .replace("ZombieSkinVariant.values()", npcClass.variant.replaceAll(/\.[^.]+$/, "") + ".values()")
          .replace("ZombieSkinVariant.valueOf(", npcClass.variant.replaceAll(/\.[^.]+$/, "") + ".valueOf(")
          .replace("// TEMPLATE_INSERT:IMPORTS", loadImports(npcClass.className, npcClass.subfolder))
          .replace("// TEMPLATE_INSERT:METHODS", loadMethods(npcClass.className, npcClass.subfolder))

      outputFile.write(content)
      println "✅ [${npcClass.className}] Generated ${outputFile}"
    }
  }
