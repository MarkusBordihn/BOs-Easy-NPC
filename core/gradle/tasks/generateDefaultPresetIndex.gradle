tasks.register('generateDefaultPresetIndex') {
  group = "build"
  def presetsDir = file("$projectDir/src/main/resources/data/easy_npc/default_preset")
  def indexFile = file("$projectDir/src/main/resources/data/easy_npc/default_preset/default_preset.index")

  inputs.files(fileTree(presetsDir) {
    include '**/*.npc.nbt'
    include '**/*.npc.snbt'
    exclude 'default_preset.index'
  }).skipWhenEmpty(false).ignoreEmptyDirectories(true)
  outputs.file(indexFile)

  doLast {
    if (!presetsDir.exists()) {
      println "⚠️ DEFAULT preset directory not found: ${presetsDir}"
      return
    }

    def presetFiles = []
    presetsDir.eachFileRecurse { file ->
      if (file.isFile() && (file.name.endsWith('.npc.nbt') || file.name.endsWith('.npc.snbt'))) {
        def relativePath = presetsDir.toPath().relativize(file.toPath()).toString()
        relativePath = relativePath.replace('\\', '/')
        presetFiles.add(relativePath)
      }
    }

    presetFiles.sort()

    indexFile.parentFile.mkdirs()
    indexFile.withWriter('UTF-8') { writer ->
      writer.println("# This file is AUTO-GENERATED by the 'generateDefaultPresetIndex' Gradle task")
      writer.println("# Do not edit manually - changes will be overwritten!")
      writer.println("# To regenerate: run './gradlew :Common:generateDefaultPresetIndex'")
      writer.println("#")
      presetFiles.each { path ->
        writer.println(path)
      }
    }

    println "✨ Generated default_preset.index with ${presetFiles.size()} presets from ${presetsDir} to ${indexFile} ..."
    presetFiles.each { path ->
      println "✅ ${path}"
    }
  }
}
