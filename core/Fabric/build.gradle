plugins {
  id 'fabric-loom'
  id 'maven-publish'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings loom.officialMojangMappings()
  modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

  // Include Common code
  implementation project(":Common")

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency)
  if (project.hasProperty('fabric_jei_mod') && project.fabric_jei_mod) {
    modRuntimeOnly("curse.maven:jei-238222:${project.fabric_jei_mod}")
  }
  if (project.hasProperty('fabric_spark_mod') && project.fabric_spark_mod) {
    modRuntimeOnly("curse.maven:spark-361579:${project.fabric_spark_mod}")
  }
  if (project.hasProperty('fabric_xaeros_minimap_mod') && project.fabric_xaeros_minimap_mod) {
    modRuntimeOnly("curse.maven:xaeros_minimap-263420:${project.fabric_xaeros_minimap_mod}")
  }

  // Cobblemon (compileOnly for Cobblemon NPC support)
  modCompileOnly("curse.maven:cobblemon-687131:5375408")

  // Easy Model Entities (API support)
  def easyModelEntitiesLocal = findLocalEasyModelEntities()
  if (easyModelEntitiesLocal != null) {
    compileOnly files(easyModelEntitiesLocal)
    testCompileOnly files(easyModelEntitiesLocal)
  } else if (project.hasProperty('fabric_easy_model_entities_mod') && project.fabric_easy_model_entities_mod) {
    modCompileOnly("curse.maven:easy-model-entities-1539533:${project.fabric_easy_model_entities_mod}")
    testCompileOnly("curse.maven:easy-model-entities-1539533:${project.fabric_easy_model_entities_mod}")
  }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesFabricRuntime = findLocalEasyModelEntitiesLoader('fabric')
  if (easyModelEntitiesFabricRuntime != null) {
    modRuntimeOnly easyModelEntitiesFabricRuntime
  } else if (project.hasProperty('fabric_easy_model_entities_mod') && project.fabric_easy_model_entities_mod) {
    modRuntimeOnly("curse.maven:easy-model-entities-fabric-1539533:${project.fabric_easy_model_entities_mod}")
  }
}

loom {
  accessWidenerPath = file("src/main/resources/easynpc.accesswidener")

  mixin {
    defaultRefmapName = "easy_npc.refmap.json"
  }

  runs {
    client {
      client()
      setConfigName("Fabric Client")
      property("fabric.logging.markers", "REGISTRIES")
      property("fabric.log.level", "debug")
      property("mixin.debug.verbose", "false")
      property("mixin.debug.export", "false")
      ideConfigGenerated(true)
      runDir("run")
    }
    server {
      server()
      setConfigName("Fabric Server")
      property("fabric.logging.markers", "REGISTRIES")
      property("fabric.log.level", "debug")
      property("mixin.debug.verbose", "false")
      property("mixin.debug.export", "false")
      ideConfigGenerated(true)
      runDir("run")
    }
    gameTest {
      server()
      name "Game Test"
      vmArg "-Dfabric-api.gametest"
    }
  }
}

processResources {
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
  from project(":Common").sourceSets.main.resources

  inputs.property "version", project.version
  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId project.archivesBaseName
      version project.version
      from components.java
      artifact jar
    }
  }
}

tasks.named('build') {
  dependsOn 'remapJar'
  finalizedBy tasks.named('publishToMavenLocal')
}

test {
  useJUnitPlatform()
  exclude '**/*'
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, remapJar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Fabric')
    mainFile.addModLoader('Quilt')
    mainFile.addRequirement('fabric-api')
    mainFile.addOptional('easy-model-entities')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = remapJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["fabric", "quilt"]
    dependencies {
      required.project "fabric-api"
      optional.project "easy-model-entities"
    }
  }
}
