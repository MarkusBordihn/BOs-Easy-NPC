plugins {
  id 'maven-publish'
  id 'net.fabricmc.fabric-loom-remap' version "${fabric_loom}"
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

loom {
  accessWidenerPath = file("src/main/resources/easynpc.accesswidener")

  mixin {
    defaultRefmapName = "easy_npc.refmap.json"
  }

  runs {
    client {
      client()
      setConfigName("Fabric Client")
      property("fabric.logging.markers", "REGISTRIES")
      property("fabric.log.level", "debug")
      property("mixin.debug.verbose", "false")
      property("mixin.debug.export", "false")
      ideConfigGenerated(true)
      runDir("run")
    }
    server {
      server()
      setConfigName("Fabric Server")
      property("fabric.logging.markers", "REGISTRIES")
      property("fabric.log.level", "debug")
      property("mixin.debug.verbose", "false")
      property("mixin.debug.export", "false")
      ideConfigGenerated(true)
      runDir("run")
    }
    gameTest {
      server()
      name "Game Test"
      vmArg "-Dfabric-api.gametest"
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${minecraft_version}"
  mappings loom.officialMojangMappings()
  modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
  modApi "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

  // Include Common code
  implementation project(":Common")

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency, skipped for game tests)
  if (!isGameTestRun && project.hasProperty('fabric_jei_mod') && project.fabric_jei_mod) {
    modRuntimeOnly("curse.maven:jei-238222:${project.fabric_jei_mod}")
  }
  if (!isGameTestRun && project.hasProperty('fabric_xaeros_minimap_mod') && project.fabric_xaeros_minimap_mod) {
    modRuntimeOnly("curse.maven:xaeros_minimap-263420:${project.fabric_xaeros_minimap_mod}")
  }

  // Easy Model Entities (API support)
  def easyModelEntitiesLocal = findLocalEasyModelEntities()
  if (easyModelEntitiesLocal != null) {
    compileOnly files(easyModelEntitiesLocal)
    testCompileOnly files(easyModelEntitiesLocal)
  } else if (project.hasProperty('fabric_easy_model_entities_version')
      && project.fabric_easy_model_entities_version) {
    modCompileOnly("maven.modrinth:easy-model-entities:${project.fabric_easy_model_entities_version}")
    testCompileOnly("maven.modrinth:easy-model-entities:${project.fabric_easy_model_entities_version}")
  }

  // Easy Model Entities (runtime dependency)
  def easyModelEntitiesFabricRuntime = findLocalEasyModelEntitiesLoader('fabric')
  if (easyModelEntitiesFabricRuntime != null) {
    modRuntimeOnly easyModelEntitiesFabricRuntime
  } else if (project.hasProperty('fabric_easy_model_entities_version')
      && project.fabric_easy_model_entities_version) {
    modRuntimeOnly("maven.modrinth:easy-model-entities:${project.fabric_easy_model_entities_version}")
  }
}

processResources {
  from project(":Common").sourceSets.main.resources

  inputs.property "version", project.version
  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }

  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
  dependsOn project(":Common").tasks.named('generateDefaultPresetIndex')
}

tasks.withType(Test).configureEach {
  failOnNoDiscoveredTests = false
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      from components.java
      artifact jar
    }
  }
}

tasks.named('build') {
  dependsOn 'remapJar'
  finalizedBy tasks.named('publishToMavenLocal')
}

test {
  useJUnitPlatform()
  exclude '**/*'
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, remapJar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Fabric')
    mainFile.addModLoader('Quilt')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = remapJar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric", "quilt"]
    dependencies {
      optional.project "tooltipfix"
      optional.project "easy-model-entities"
    }
  }
}
