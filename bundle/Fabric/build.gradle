plugins {
  id 'maven-publish'
  id 'net.fabricmc.fabric-loom' version "${fabric_loom}"
  id 'net.darkhax.curseforgegradle' version '1.2.30'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (versionParts.size() > 0) {
    def majorVersion = versionParts[0].toInteger()
    return "${majorVersion + 1}.0.0"
  }
  return "1.0.0"
}

def nextMajorVersion = getNextMajorVersion(project.version.toString())

loom {
  runs {
    client {
      client()
      setConfigName("Fabric Client")
      ideConfigGenerated(true)
      runDir("run/client")
    }
    server {
      server()
      setConfigName("Fabric Server")
      ideConfigGenerated(true)
      runDir("run/server")
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

  // Include Common code
  implementation project(":Common")

  // Bundle dependencies - use compileOnly to avoid transitive dependency issues
  runtimeOnly(group: 'de.markusbordihn.easynpc', name: "easy_npc-fabric-${project.minecraft_version}", version: "${project.version}")
  runtimeOnly(group: 'de.markusbordihn.easynpc.configui', name: "easy_npc_config_ui-fabric-${project.minecraft_version}", version: "${project.version}")

  // Easy Model Entities (Easy Model NPC support), local-first with CurseForge fallback.
  def easyModelEntitiesFabricRuntime = findLocalEasyModelEntitiesLoader('fabric')
  if (easyModelEntitiesFabricRuntime != null) {
    runtimeOnly easyModelEntitiesFabricRuntime
  } else if (project.hasProperty('fabric_easy_model_entities_mod') && project.fabric_easy_model_entities_mod) {
    runtimeOnly("curse.maven:easy_model_entities-fabric-1539534:${project.fabric_easy_model_entities_mod}")
  }
}

tasks.withType(JavaCompile).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

processResources {
  from project(":Common").sourceSets.main.resources
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  inputs.property "version", project.version
  inputs.property 'nextMajorVersion', nextMajorVersion

  filesMatching("fabric.mod.json") {
    expand "version": project.version,
        "nextMajorVersion": nextMajorVersion
  }
}

tasks.withType(Test).configureEach {
  failOnNoDiscoveredTests = false
}

tasks.named('compileTestJava', JavaCompile).configure {
  enabled = !sourceSets.test.allSource.isEmpty()
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Fabric')
    mainFile.addModLoader('Quilt')
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRequirement('easy-npc-core', 'easy-npc-config-ui')
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file('../CHANGELOG.md').text
    uploadFile = jar
    gameVersions = ["${minecraft_version}"]
    loaders = ["fabric", "quilt"]
    dependencies {
      required.project "easy-npc-core"
      required.project "easy-npc-config-ui"
      optional.project "tooltipfix"
      optional.project "easy-model-entities"
    }
  }
}
