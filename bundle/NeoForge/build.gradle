plugins {
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.141'
  id 'net.darkhax.curseforgegradle' version '1.2.30'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    name = 'NeoForge'
    url = 'https://maven.neoforged.net/releases/'
  }
  maven {
    name = 'Sponge / Mixin'
    url = 'https://repo.spongepowered.org/repository/maven-public/'
  }
}

neoForge {
  version = project.neoforge_version

  accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
  }

  runs {
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }

    client {
      client()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
      server()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      programArgument '--nogui'
    }

    gameTestServer {
      type = 'gameTestServer'
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
  }

  mods {
    "${project.mod_id}" {
      sourceSet sourceSets.main
    }
  }

}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  // Regular dependencies for development mode (runClient/runServer)
  runtimeOnly(group: 'de.markusbordihn.easynpc', name: "easy_npc-neoforge-${project.minecraft_version}", version: "${project.version}") {
    changing = true
  }
  runtimeOnly(group: 'de.markusbordihn.easynpc.configui', name: "easy_npc_config_ui-neoforge-${project.minecraft_version}", version: "${project.version}") {
    changing = true
  }

  // Easy Model Entities (Easy Model NPC support), local-first with Modrinth fallback.
  def easyModelEntitiesNeoForgeRuntime = findLocalEasyModelEntitiesLoader('neoforge')
  if (easyModelEntitiesNeoForgeRuntime != null) {
    runtimeOnly easyModelEntitiesNeoForgeRuntime
  } else if (project.hasProperty('neoforge_easy_model_entities_version')
      && project.neoforge_easy_model_entities_version) {
    runtimeOnly "maven.modrinth:easy-model-entities:${project.neoforge_easy_model_entities_version}"
  }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") && !it.name.contains("Test") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
  from(project(":Common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from project(":Common").sourceSets.main.resources
}

tasks.named('compileTestJava', JavaCompile).configure {
  enabled = !sourceSets.test.allSource.isEmpty()
}

def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (versionParts.size() > 0) {
    def majorVersion = versionParts[0].toInteger()
    return "${majorVersion + 1}.0.0"
  }
  return "1.0.0"
}

processResources {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  inputs.property 'version', project.version

  def nextMajor = getNextMajorVersion(project.version.toString())
  inputs.property 'nextMajorVersion', nextMajor

  filesMatching(['META-INF/neoforge.mods.toml']) {
    expand 'file': [
        'jarVersion'      : project.version,
        'nextMajorVersion': nextMajor
    ]
  }
}

jar {
  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.mod_author}",
        "Specification-Version"   : "${project.version}",
        "Implementation-Title"    : "${project.mod_name}",
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_author}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
  }
}

test {
  useJUnitPlatform()
  failOnNoDiscoveredTests = false
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("../CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('NeoForge')
    mainFile.addOptional('easy-model-entities')
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRequirement('easy-npc-core', 'easy-npc-config-ui')
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
      required.project "easy-npc-core"
      required.project "easy-npc-config-ui"
      optional.project "easy-model-entities"
    }
  }
}

sourceSets.each {
  def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
  it.output.resourcesDir = dir
  it.java.destinationDirectory = dir
}
