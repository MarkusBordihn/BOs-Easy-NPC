plugins {
  id 'idea'
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(21)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    mavenLocal()
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
    maven {
      name = "Modrinth"
      url = "https://api.modrinth.com/maven"
      content {
        includeGroup "maven.modrinth"
      }
    }
  }

  dependencies {
    configurations.configureEach {
      resolutionStrategy.force 'org.ow2.asm:asm:9.8'
      resolutionStrategy.force 'org.ow2.asm:asm-commons:9.8'
    }
  }

  configurations.named('testRuntimeOnly') {
    setExtendsFrom([])
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}

  idea {
    module {
      downloadSources = true
      downloadJavadoc = true
    }
  }

  // Local Easy Model Entities loader artifact (runtime); null falls back to CurseForge.
  ext.findLocalEasyModelEntitiesLoader = { String loader ->
    def version = project.findProperty('easy_model_entities_version')
    if (version == null) {
      return null
    }
    def mcVersion = project.minecraft_version
    def jar =
        file("${System.getProperty('user.home')}/.m2/repository/de/markusbordihn/easymodelentities/"
            + "easy_model_entities-${loader}-${mcVersion}/${version}/"
            + "easy_model_entities-${loader}-${mcVersion}-${version}.jar")
    if (!jar.exists()) {
      return null
    }

    // Fabric Loom keys its remap cache by coordinate and version only, so a jar republished to
    // mavenLocal under the same version would keep resolving to the previous remap.
    rootProject.file(".gradle/loom-cache/remapped_mods/remapped/de/markusbordihn/easymodelentities")
        .listFiles()
        ?.findAll { cacheDirectory ->
          cacheDirectory.name.startsWith("easy_model_entities-${loader}-${mcVersion}-")
        }
        ?.collect { cacheDirectory -> new File(cacheDirectory, version) }
        ?.findAll { remappedVersion ->
          remappedVersion.isDirectory() && remappedVersion.lastModified() < jar.lastModified()
        }
        ?.each { staleRemap ->
          logger.lifecycle("Discarding stale Loom remap ${staleRemap}")
          project.delete(staleRemap)
        }
    return "de.markusbordihn.easymodelentities:easy_model_entities-${loader}-${mcVersion}:${version}"
  }

  configurations.configureEach {
    resolutionStrategy {
      cacheChangingModulesFor 0, 'minutes'
      cacheDynamicVersionsFor 15, 'minutes'
    }
  }
}

configure(subprojects.findAll { subproject -> subproject.name in ['Forge', 'Fabric', 'NeoForge'] }) {
  apply from: "$rootDir/../gradle/releaseSmokeTestConfig.gradle"
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs check for all platforms (Common, Fabric, Forge, NeoForge).'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', ':NeoForge:check'
}
