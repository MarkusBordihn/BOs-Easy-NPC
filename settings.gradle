pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'NeoForge'
      url = 'https://maven.neoforged.net/releases/'
    }
    maven {
      name = 'Forge'
      url = 'https://maven.minecraftforge.net/'
    }
    maven {
      name = 'Sponge Snapshots'
      url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
  }
}

rootProject.name = 'Easy NPC 1.21.1'

file('core').listFiles()?.each { dir ->
  if (dir.isDirectory() && file("${dir.path}/build.gradle").exists()) {
    include "core:${dir.name}"
  }
}

file('config').listFiles()?.each { dir ->
  if (dir.isDirectory() && file("${dir.path}/build.gradle").exists()) {
    include "config:${dir.name}"
  }
}
