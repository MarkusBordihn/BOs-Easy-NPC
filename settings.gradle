pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'NeoForge'
      url = 'https://maven.neoforged.net/releases/'
    }
    maven {
      name = 'Forge'
      url = 'https://maven.minecraftforge.net/'
    }
    maven {
      name = 'Sponge Snapshots'
      url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
  }
}

rootProject.name = 'Easy NPC 1.18.2'

gradle.beforeProject { project ->
  if (project.name == 'bundle') {
    project.tasks.named('build') {
      dependsOn gradle.includedBuild('core').task(':build')
      dependsOn gradle.includedBuild('core').task(':publishToMavenLocal')
      dependsOn gradle.includedBuild('config-ui').task(':build')
      dependsOn gradle.includedBuild('config-ui').task(':publishToMavenLocal')
    }
  }
}

includeBuild('core') {
  name = 'core'
}

includeBuild('config-ui') {
  name = 'config-ui'
}

includeBuild('bundle') {
  name = 'bundle'
}
